<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stránka nenájdená | Poriado</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{--navy:#1f3864;--blue:#2e75b6;--light:#dce6f1}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;min-height:100vh;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box h1{font-size:5rem;letter-spacing:2px}
  .box .logo{font-weight:800;font-size:1.6rem;margin-bottom:26px}
  .box .logo span{color:#9fc0e8}
  .box p{color:var(--light);margin:14px 0 30px;font-size:1.05rem;line-height:1.6}
  .btn{display:inline-block;background:#fff;color:var(--navy);padding:14px 30px;border-radius:10px;
    font-weight:700;text-decoration:none;margin:0 6px 10px;font-size:1.02rem}
  .btn:hover{background:var(--light)}
  .ghost{background:transparent;color:#fff;border:2px solid #fff}
  .ghost:hover{background:rgba(255,255,255,.15)}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Poriado<span>.</span></div>
    <h1>404</h1>
    <p>Túto stránku sme nenašli — asi ju už niekto upratal. 🧹<br>Všetko dôležité ale nájdete na hlavnej stránke.</p>
    <a href="/" class="btn">Späť na poriado.sk</a>
    <a href="tel:+421949076917" class="btn ghost">Zavolať: +421 949 076 917</a>
  </div>
</body>
</html>
