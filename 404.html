<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Bez tohto vnuteny tmavy rezim (napr. Samsung Internet) prefarbi text na zlatych
     tlacidlach a kontrast by klesol. Web ma vlastnu svetlu paletu. -->
<meta name="color-scheme" content="only light">
<title>Stránka nenájdená | Poriado</title>
<meta name="robots" content="noindex">
<!-- Meranie patrí aj sem. Na túto stránku vie doletieť platená návštevnosť
     (zle nastavená cieľová adresa v reklame, starý odkaz z Googlu) a bez
     merania o nej nevieme nič — v štatistikách chýba aj tá návšteva, aj to,
     že sa z nej nikto neodrazil ďalej. -->
<script src="poriado-meranie.js" defer></script>
<link rel="preload" href="pismo/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#9633fd">
<style>
  @font-face{font-family:'Instrument Sans';src:url('pismo/instrument-sans.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}

  :root{--navy:#471683;--blue:#7424D6; --blue-tmava:#5C1DAA;--light:#F8F4FF;--gold:#FFD632}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:linear-gradient(135deg,#7424D6,#9633FD);color:#fff;min-height:100vh;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-synthesis:none}
  .box h1{font-size:5rem;letter-spacing:2px}
  .box .logo{font-weight:800;font-size:1.6rem;margin-bottom:26px}
  .box .logo span{color:var(--gold)}
  .box p{color:var(--light);margin:14px 0 30px;font-size:1.05rem;line-height:1.6}
  .btn{display:inline-block;background:#fff;color:var(--navy);padding:14px 30px;border-radius:10px;
    font-weight:700;text-decoration:none;margin:0 6px 10px;font-size:1.02rem}
  .btn:hover{background:var(--light)}
  .ghost{background:transparent;color:#fff;border:2px solid #fff}
  .ghost:hover{background:rgba(255,255,255,.15)}
  .box .male{color:var(--light);font-size:.92rem;margin:18px 0 0}

  /* ── Tlač ─────────────────────────────────────────────────────────────────
     Na papieri platí iné než na obrazovke: nedá sa scrollovať, prvky, ktoré sa
     držia na mieste, sa vypaľujú na každú stranu, a tlačiareň štandardne
     nevytlačí farebné pozadia — svetlý text na tmavom páse by zmizol.
     Papier A4 má navyše asi 794 px, takže platia mobilné pravidlá. */
  @media print{
    body{background:#fff!important;color:var(--ink,#1c2530)!important}
    body *{color:inherit!important}
  }
  </style>
</head>
<body>
  <main class="box">
    <div class="logo">Poriado<span>.</span></div>
    <h1>404</h1>
    <p>Túto stránku sme nenašli — asi ju už niekto upratal. 🧹<br>Upratovanie v Bratislave si môžete rezervovať aj odtiaľto.</p>
    <a href="rezervacia.html" class="btn">Rezervovať termín</a>
    <a href="/" class="btn ghost">Späť na poriado.sk</a>
    <a href="tel:+421949061088" class="btn ghost">Zavolať: +421 949 061 088</a>
    <p class="male">Byty a domy od 79,90 €. Čistiace prostriedky aj doprava po Bratislave v cene.</p>
  </main>
</body>
</html>
